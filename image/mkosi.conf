# buntOS 공통 이미지 레시피. 아키텍처별 차이는 bsp/<보드>/mkosi.conf에만 둔다(D3).
# 빌드는 tools/image/build.sh <보드>로 한다 (docs/dev/environment.md).

[Distribution]
Distribution=debian
Release=forky
# ADR-004: snapshot.debian.org의 특정 시점으로 고정한다. 갱신은 별도 PR로 올린다
Snapshot=20261027T083111Z

[Output]
Format=disk
ImageId=buntos

[Content]
Bootable=yes
Bootloader=systemd-boot
# mkosi는 Essential 패키지와 여기 적은 것만 설치한다. Debian에서 Priority: required이지만
# Essential이 아닌 login, passwd, apt, tzdata는 직접 적어야 한다
# (없으면 콘솔 로그인, 패키지 설치, 시간대 설정이 안 된다).
# libnss-myhostname은 시스템 설정에서 바꾼 호스트 이름도 바로 찾게 한다(없으면 sudo가 매번 경고한다).
# 네트워크는 NetworkManager가 관리한다(메뉴바의 네트워크 아이콘이 상태를 읽는다). Wi-Fi용
# wpasupplicant와 펌웨어는 mkosi.conf.d/40-drivers.conf에 있다.
# curl은 macOS처럼 터미널에서 바로 쓰도록 기본으로 둔다
Packages=
        login
        passwd
        apt
        tzdata
        debian-archive-keyring
        ca-certificates
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        udev
        dbus
        btrfs-progs
        sudo
        libnss-myhostname
        network-manager
        curl
Locale=en_US.UTF-8
# 한국어 우선 이미지의 기본 시간대. 최초 설정을 설계하면 거기서 고른다
Timezone=Asia/Seoul
Keymap=us
Hostname=buntos
# UKI에 넣는 커널 모듈 initrd에는 루트 파일 시스템을 여는 데 필요한 모듈만 넣는다. 모든 모듈을 넣으면
# 그 모듈들이 쓰는 펌웨어(40-drivers.conf)까지 따라 들어가 initrd가 220MB가 되고 부팅이 10초 넘게 늦어진다.
# 나머지 모듈과 펌웨어는 루트로 바꾼 뒤 /usr/lib에서 읽는다.
# default는 mkosi-initrd의 기본 목록(디스크, 파일 시스템, 입력 장치)이고, 그 밖은 VM(virtio), 태블릿·보드
# (UFS, MMC), USB 부팅에 쓴다
KernelModulesInitrdInclude=
        default
        virtio_blk
        virtio_scsi
        virtio_pci
        virtio_mmio
        /drivers/ufs/
        /drivers/mmc/
        /drivers/usb/host/
# 계정은 처음 켤 때 로그인 화면(bunt-greeter)이 만든다. systemd의 최초 설정 화면은 끈다
KernelCommandLine=systemd.firstboot=no
# 직렬 콘솔의 root 자동 로그인: e2e와 개발 도구가 쓴다. 공개 이미지에서는 막는다
Autologin=yes

[Runtime]
# 게스트가 에뮬레이션 TPM을 잡지 못하는 문제가 풀릴 때까지 끈다 (docs/dev/environment.md의 알려진 문제)
TPM=no
# 시험 VM(mkosi vm: e2e, screenshot.sh)은 CPU 둘로 띄운다(tools/image/vmctl.sh와 같다). 하나면 바쁜 Mac에서
# Firefox가 처음 뜨는 데 1분을 넘겨 e2e 5번이 실패했다 (2026-10-30)
CPUs=2
