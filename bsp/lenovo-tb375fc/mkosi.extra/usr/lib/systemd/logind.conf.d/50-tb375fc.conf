# 전원 키를 한 번 누르면 잠든다. 드라이버(패치 0186)가 뗄 때 누름을 알리므로 잠들기 전에
# 10초 잡기를 가릴 수 있고, 깨운 누름은 알리지 않는다. 10초 강제 종료는 커널이 한다.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=ignore
# 덮개를 닫으면 잠든다. 깨어난 뒤 기본 30초 동안은 덮개를 무시해, 덮개를 닫은 채 화면이 켜져 있었다
HandleLidSwitch=suspend
HoldoffTimeoutSec=3s
